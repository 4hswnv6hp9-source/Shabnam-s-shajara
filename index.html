<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qalandarovlar va Tillayevlar shajarasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#f6f4ea; --fg:#26301f; --muted:#667058; --br:#8a5a2b; --canopy:#d9ebb8; --warm:#ffe2b0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121a12; --fg:#ecf2e4; --muted:#a3b39b; --br:#b98650; --canopy:#1f4a2b; --warm:#4a3213;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(ellipse 55% 38% at 22% 0%,var(--canopy),transparent 72%),
    radial-gradient(ellipse 55% 38% at 78% 0%,var(--warm),transparent 72%),
    var(--bg);
  color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
}
header{text-align:center;padding:28px 18px 8px}
h1{font:700 clamp(24px,5.6vw,36px)/1.15 "Lora",Georgia,serif;margin:0 auto 8px;max-width:20ch}
header p{margin:0 auto;max-width:36ch;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;padding:10px 18px 0;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px 2px 6px 2px;vertical-align:-2px;margin-right:5px}

.scroll{overflow-x:auto;padding:34px 12px 0;-webkit-overflow-scrolling:touch}
.inner{display:inline-block;min-width:100%}

/* Daraxt: tana pastda, shoxlar tepaga o‘sadi */
.tree ul{display:flex;justify-content:center;align-items:flex-end;margin:0;padding:0 0 22px;position:relative}
.tree>ul{padding-bottom:0}
.tree li{list-style:none;display:flex;flex-direction:column-reverse;align-items:center;position:relative;padding:0 5px 22px}
.tree>ul>li{padding-bottom:0}
.tree li::before,.tree li::after{content:"";position:absolute;bottom:0;right:50%;width:50%;height:22px;border-bottom:2px solid var(--br)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--br)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-bottom:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--br);border-radius:0 0 10px 0}
.tree li:first-child::after{border-radius:0 0 0 10px}
.tree ul ul::before{content:"";position:absolute;bottom:0;left:50%;height:22px;border-left:2px solid var(--br)}

/* Barglar */
.node{
  width:148px;padding:9px 9px 10px;text-align:center;color:#fff;
  border-radius:22px 4px 22px 4px;font-size:13px;line-height:1.25;
  box-shadow:0 3px 8px rgba(0,0,0,.22);
  animation:grow .6s both;animation-delay:calc((var(--d) - 1) * .22s);
}
.node small{display:block;font-size:10.5px;opacity:.8}
.node i{display:block;font-style:normal;font-size:11.5px;font-weight:600;margin-bottom:5px}
.pp b{display:block;font-size:13px}
.pp span{font-size:12px;opacity:.9}
.pp+.pp{margin-top:6px;padding-top:6px;border-top:1px dashed color-mix(in srgb,currentColor 45%,transparent)}

.g1{width:172px;background:linear-gradient(135deg,#ffc2d9,#f58fb4);color:#4a1228;
    box-shadow:0 0 0 3px #fff,0 0 24px 8px rgba(245,143,180,.6)}
.g2{background:#6b4423}
.k.g3{background:#2a6234}.k.g4{background:#3f8a45}.k.g5{background:#8cc65f;color:#173012}
.t.g3{background:#9a4f12}.t.g4{background:#e08a2e;color:#2e1600}.t.g5{background:#f3c46b;color:#3a2200}

@keyframes grow{from{opacity:0;transform:translateY(14px) scale(.75)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.node{animation:none}}

.ground{
  height:58px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#6b4423,#37230f);color:#ecd9b8;font-weight:600;font-size:13px;
}
.end{height:28px}
</style>
</head>
<body>

<header>
  <h1>🌳 Qalandarovlar va Tillayevlar shajarasi</h1>
  <p>Pastdan tepaga o‘qing: tana yonida — bolalar, shoxlar uchida — eng uzoq ajdodlar.</p>
</header>

<div class="legend">
  <span><i style="background:#f58fb4"></i>Bolalar</span>
  <span><i style="background:#6b4423"></i>Ota-onalar</span>
  <span><i style="background:#3f8a45"></i>Qalandarovlar</span>
  <span><i style="background:#e08a2e"></i>Tillayevlar</span>
</div>

<div class="scroll" id="scroll">
  <div class="inner">
    <div class="tree" id="tree"></div>
    <div class="ground">🌱 Bugungi kun</div>
  </div>
</div>
<div class="end"></div>

<script>
/* Ma’lumot: p — shu avlod odamlari [ism, tug‘ilgan yil], c — yuqoridagi (ota-ona) avlod,
   t — yorliq, s — shox rangi (k — Qalandarovlar, t — Tillayevlar). O‘zingiznikiga almashtirishingiz mumkin. */
const TREE={t:"bolalar",p:[["Usmon Qalandarov",2004],["Shabnam Qalandarova",2009],["Muslima Qalandarova",2020]],c:[
 {t:"ota-onalar",p:[["Azamat Qalandarov",1983],["Nasiba Tillayeva",1984]],c:[
  {t:"otaning ota-onasi",s:"k",p:[["Rustam Qalandarov",1958],["Malika Qalandarova",1961]],c:[
   {p:[["Salim Qalandarov",1930],["Farida Qalandarova",1935]],c:[
    {p:[["Abdulla Qalandarov",1898],["Robiya Qalandarova",1903]]}]},
   {p:[["Karim Qalandarov",1927],["Xadicha Qalandarova",1932]],c:[
    {p:[["Ismoil Qalandarov",1895],["Oysha Qalandarova",1901]]}]}]},
  {t:"onaning ota-onasi",s:"t",p:[["Baxtiyor Tillayev",1955],["Zuhra Tillayeva",1959]],c:[
   {p:[["Mahmud Tillayev",1925],["Saodat Tillayeva",1931]],c:[
    {p:[["Mirza Tillayev",1892],["Bibisara Tillayeva",1897]]}]},
   {p:[["Yusuf Tillayev",1928],["Maryam Tillayeva",1934]],c:[
    {p:[["Nuriddin Tillayev",1894],["Munira Tillayeva",1900]]}]}]}]}]};

function branch(n,d,side){
  side=n.s||side||"";
  const kids=(n.c||[]).map(k=>branch(k,d+1,side)).join("");
  const ppl=n.p.map(([name,y])=>{
    const f=/a$/.test(name.split(" ").pop());
    return `<div class="pp"><b>${name}</b><span>${f?"♀":"♂"}\uFE0E ${y}</span></div>`;
  }).join("");
  return `<li><div class="node g${d} ${side}" style="--d:${d}"><small>${d}-avlod</small>`+
    (n.t?`<i>${n.t}</i>`:"")+ppl+`</div>`+(kids?`<ul>${kids}</ul>`:"")+`</li>`;
}
document.getElementById("tree").innerHTML=`<ul>${branch(TREE,1)}</ul>`;

/* Sahifa ochilganda daraxt o‘rtasi ko‘rinsin */
const wrap=document.getElementById("scroll"),root=document.querySelector(".g1");
const r=root.getBoundingClientRect(),w=wrap.getBoundingClientRect();
wrap.scrollLeft+=r.left-w.left-(w.width-r.width)/2;
</script>
</body>
</html>
